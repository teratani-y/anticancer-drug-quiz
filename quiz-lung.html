    } catch (e) { quizFeedback = {}; }
  }
  function quizSaveFeedback() {
    try { localStorage.setItem('lungQuizFeedback_v1', JSON.stringify(quizFeedback)); } catch (e) {}
  }
  function quizBuildRatingRow(qi) {
    var row = document.createElement('div');
    row.className = 'rate-row';
    var label = document.createElement('span');
    label.className = 'rate-label';
    label.textContent = 'この問題の評価:';
    var goodBtn = document.createElement('button');
    goodBtn.type = 'button'; goodBtn.className = 'rate-btn'; goodBtn.textContent = '👍 良問';
    var badBtn = document.createElement('button');
    badBtn.type = 'button'; badBtn.className = 'rate-btn'; badBtn.textContent = '👎 悪問';
    function refresh() {
      goodBtn.classList.toggle('active-good', quizFeedback[qi] === 'good');
      badBtn.classList.toggle('active-bad', quizFeedback[qi] === 'bad');
    }
    goodBtn.onclick = function () {
      quizFeedback[qi] = (quizFeedback[qi] === 'good') ? null : 'good';
      if (!quizFeedback[qi]) delete quizFeedback[qi];
      quizSaveFeedback(); refresh();
    };
    badBtn.onclick = function () {
      quizFeedback[qi] = (quizFeedback[qi] === 'bad') ? null : 'bad';
      if (!quizFeedback[qi]) delete quizFeedback[qi];
      quizSaveFeedback(); refresh();
    };
    refresh();
    row.appendChild(label); row.appendChild(goodBtn); row.appendChild(badBtn);
    return row;
  }
  function quizFallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  function quizExportFeedback() {
    var ratedIdx = Object.keys(quizFeedback);
    if (ratedIdx.length === 0) {
      alert('まだ評価された問題がありません。各問題に回答した後に表示される「👍 良問」「👎 悪問」ボタンで評価してから、もう一度お試しください。');
      return;
    }
    var goodList = [], badList = [];
    ratedIdx.forEach(function (idxStr) {
      var idx = parseInt(idxStr, 10);
      var item = QUIZ[idx];
      if (!item) return;
      var entry = '・[' + item.category + '] ' + item.q + '\n  選択肢: ' + item.choices.join(' / ') + '\n  正解: ' + item.choices[item.correct];
      if (quizFeedback[idx] === 'good') goodList.push(entry);
      else if (quizFeedback[idx] === 'bad') badList.push(entry);
    });
    var text = '【肺癌クイズ(quiz-lung.html)フィードバック】\n\n' +
      '良問と評価された問題(' + goodList.length + '件):\n' + (goodList.length ? goodList.join('\n\n') : '(なし)') + '\n\n' +
      '悪問と評価された問題(' + badList.length + '件) — 改善・差し替えを検討してください:\n' + (badList.length ? badList.join('\n\n') : '(なし)') + '\n\n' +
      '参照ファイル: artifacts/html/oncology-reports/quiz-lung.html\n\n' +
      '上記フィードバックを踏まえて、「悪問」と評価された問題をレポート本文(artifacts/html/oncology-reports/lung.html)の内容に基づいて改善・差し替えてください。「良問」と評価された問題は現状を維持してください。';
    var notify = function () { alert('フィードバックをコピーしました。MulmoClaudeのチャットに貼り付けて送信してください。問題の改善に使います。'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(notify).catch(function () { quizFallbackCopy(text, notify); });
    } else { quizFallbackCopy(text, notify); }
  }
  function quizResetFeedback() {
    if (!confirm('すべての評価をリセットします。よろしいですか?')) return;
    quizFeedback = {};
    quizSaveFeedback();
    alert('評価をリセットしました。');
  }

  function quizShuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function quizRenderQuestion() {
    document.getElementById('quiz-result-area').style.display = 'none';
    document.getElementById('quiz-question-area').style.display = 'block';
    var qi = quizOrder[quizIndex];
    var item = QUIZ[qi];
    document.getElementById('quiz-progress-text').textContent = '問 ' + (quizIndex + 1) + ' / ' + QUIZ.length;
    document.getElementById('quiz-cat-badge').textContent = item.category;
    document.getElementById('quiz-progress-fill').style.width = Math.round((quizIndex / QUIZ.length) * 100) + '%';
    document.getElementById('quiz-question-text').textContent = item.q;
    document.getElementById('quiz-explain-area').style.display = 'none';
    document.getElementById('quiz-explain-area').innerHTML = '';
    document.getElementById('quiz-next-btn').style.display = 'none';

    var wrap = document.getElementById('quiz-choices');
    wrap.innerHTML = '';
    item.choices.forEach(function (choiceText, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quiz-choice';
      btn.textContent = choiceText;
      btn.onclick = function () { quizAnswer(idx); };
      wrap.appendChild(btn);
    });
  }

  function quizAnswer(selectedIdx) {
    var qi = quizOrder[quizIndex];
    var item = QUIZ[qi];
    quizAnswers[qi] = selectedIdx;
    var buttons = document.getElementById('quiz-choices').querySelectorAll('.quiz-choice');
    buttons.forEach(function (btn, idx) {
      btn.disabled = true;
      if (idx === item.correct) btn.classList.add('correct');
      else if (idx === selectedIdx) btn.classList.add('wrong');
    });
    var explainArea = document.getElementById('quiz-explain-area');
    var isCorrect = selectedIdx === item.correct;
    explainArea.className = 'quiz-explain';
    explainArea.style.display = 'block';
    explainArea.innerHTML = '<div style="font-weight:700; margin-bottom:4px; color:' + (isCorrect ? 'var(--good)' : 'var(--critical)') + ';">' +
      (isCorrect ? '✅ 正解' : '❌ 不正解(正解: ' + item.choices[item.correct] + ')') + '</div>' +
      '<div>' + item.explain + '</div>';
    explainArea.appendChild(quizBuildRatingRow(qi));
    document.getElementById('quiz-next-btn').style.display = 'inline-block';
    document.getElementById('quiz-next-btn').textContent = (quizIndex === QUIZ.length - 1) ? '結果を見る →' : '次の問題 →';
  }

  function quizNext() {
    if (quizIndex < QUIZ.length - 1) {
      quizIndex++;
      quizRenderQuestion();
    } else {
      quizShowResult();
    }
  }

  function quizShowResult() {
    document.getElementById('quiz-progress-fill').style.width = '100%';
    document.getElementById('quiz-progress-text').textContent = '完了 ' + QUIZ.length + ' / ' + QUIZ.length;
    document.getElementById('quiz-cat-badge').textContent = '';
    document.getElementById('quiz-question-area').style.display = 'none';

    var correctCount = 0;
    var byCategory = {};
    QUIZ.forEach(function (item, i) {
      if (!byCategory[item.category]) byCategory[item.category] = { correct: 0, total: 0 };
      byCategory[item.category].total++;
      if (quizAnswers[i] === item.correct) { correctCount++; byCategory[item.category].correct++; }
    });
    var pct = Math.round((correctCount / QUIZ.length) * 100);

    var catHtml = '';
    Object.keys(byCategory).forEach(function (cat) {
      var c = byCategory[cat];
      var p = Math.round((c.correct / c.total) * 100);
      catHtml += '<div class="cat-result-row"><span class="text-xs" style="width:150px; flex-shrink:0;">' + cat + '</span>' +
        '<div class="cat-result-bar"><div class="cat-result-fill" style="width:' + p + '%"></div></div>' +
        '<span class="text-xs muted" style="width:56px; text-align:right;">' + c.correct + '/' + c.total + '</span></div>';
    });

    var reviewHtml = '';
    QUIZ.forEach(function (item, i) {
      if (quizAnswers[i] !== item.correct) {
        reviewHtml += '<div class="review-item">' +
          '<div class="text-sm font-semibold mb-1">' + item.q + '</div>' +
          '<div class="text-xs muted mb-2">あなたの回答: ' + (quizAnswers[i] != null ? item.choices[quizAnswers[i]] : '(未回答)') + ' / 正解: ' + item.choices[item.correct] + '</div>' +
          '<div class="text-xs" style="line-height:1.6;">' + item.explain + '</div>' +
          '</div>';
      }
    });
    if (!reviewHtml) reviewHtml = '<p class="text-sm secondary">全問正解です。見直しの必要な項目はありません 🎉</p>';

    var goodCount = 0, badCount = 0;
    Object.keys(quizFeedback).forEach(function (k) {
      if (quizFeedback[k] === 'good') goodCount++;
      else if (quizFeedback[k] === 'bad') badCount++;
    });

    var resultArea = document.getElementById('quiz-result-area');
    resultArea.style.display = 'block';
    resultArea.innerHTML =
      '<div class="text-center mb-6">' +
        '<div class="score-ring-num" style="color:var(--series-new);">' + correctCount + ' / ' + QUIZ.length + '</div>' +
        '<div class="text-sm muted mt-1">正答率 ' + pct + '%</div>' +
      '</div>' +
      '<div class="mb-6"><div class="text-sm font-semibold mb-3">カテゴリ別正答率</div>' + catHtml + '</div>' +
      '<div class="mb-2 text-sm font-semibold">見直し(不正解・未回答の問題)</div>' +
      '<div class="mb-6">' + reviewHtml + '</div>' +
      '<div class="mb-6 pt-4 border-t" style="border-color:var(--gridline);">' +
        '<div class="text-sm font-semibold mb-2">問題の評価状況</div>' +
        '<div class="text-xs muted mb-3">👍 良問 ' + goodCount + '件 ・ 👎 悪問 ' + badCount + '件(全' + QUIZ.length + '問中、未評価は反映されません)</div>' +
        '<div class="flex flex-wrap gap-3">' +
          '<button type="button" class="quiz-btn-outline" onclick="quizExportFeedback()">📋 フィードバックをエクスポート(チャットに貼り付け用)</button>' +
          '<button type="button" class="quiz-btn-outline" onclick="quizResetFeedback()" style="border-color:var(--critical); color:var(--critical);">🗑 評価をリセット</button>' +
        '</div>' +
      '</div>' +
      '<div class="flex flex-wrap gap-3 justify-center">' +
        '<button type="button" class="quiz-btn" onclick="quizRestart(true)">🔀 シャッフルしてもう一度</button>' +
        '<a href="lung.html" class="quiz-btn-outline" style="text-decoration:none; display:inline-block;">レポート本文に戻る</a>' +
      '</div>';
  }

  function quizRestart(shuffle) {
    quizOrder = QUIZ.map(function (_, i) { return i; });
    if (shuffle) quizShuffle(quizOrder);
    quizIndex = 0;
    quizAnswers = [];
    quizRenderQuestion();
  }

  quizLoadFeedback();
  quizRenderQuestion();
</script>
