  var quizOrder = QUIZ.map(function (_, i) { return i; });

  function quizShuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function quizRenderQuestion() {
    document.getElementById('quiz-result-area').style.display = 'none';
    document.getElementById('quiz-question-area').style.display = 'block';
    var qi = quizOrder[quizIndex];
    var item = QUIZ[qi];
    document.getElementById('quiz-progress-text').textContent = '問 ' + (quizIndex + 1) + ' / ' + QUIZ.length;
    document.getElementById('quiz-cat-badge').textContent = item.category;
    document.getElementById('quiz-progress-fill').style.width = Math.round((quizIndex / QUIZ.length) * 100) + '%';
    document.getElementById('quiz-question-text').textContent = item.q;
    document.getElementById('quiz-explain-area').style.display = 'none';
    document.getElementById('quiz-explain-area').innerHTML = '';
    document.getElementById('quiz-next-btn').style.display = 'none';

    var wrap = document.getElementById('quiz-choices');
    wrap.innerHTML = '';
    item.choices.forEach(function (choiceText, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quiz-choice';
      btn.textContent = choiceText;
      btn.onclick = function () { quizAnswer(idx); };
      wrap.appendChild(btn);
    });
  }

  function quizAnswer(selectedIdx) {
    var qi = quizOrder[quizIndex];
    var item = QUIZ[qi];
    quizAnswers[qi] = selectedIdx;
    var buttons = document.getElementById('quiz-choices').querySelectorAll('.quiz-choice');
    buttons.forEach(function (btn, idx) {
      btn.disabled = true;
      if (idx === item.correct) btn.classList.add('correct');
      else if (idx === selectedIdx) btn.classList.add('wrong');
    });
    var explainArea = document.getElementById('quiz-explain-area');
    var isCorrect = selectedIdx === item.correct;
    explainArea.className = 'quiz-explain';
    explainArea.style.display = 'block';
    explainArea.innerHTML = '<div style="font-weight:700; margin-bottom:4px; color:' + (isCorrect ? 'var(--good)' : 'var(--critical)') + ';">' +
      (isCorrect ? '✅ 正解' : '❌ 不正解(正解: ' + item.choices[item.correct] + ')') + '</div>' +
      '<div>' + item.explain + '</div>';
    document.getElementById('quiz-next-btn').style.display = 'inline-block';
    document.getElementById('quiz-next-btn').textContent = (quizIndex === QUIZ.length - 1) ? '結果を見る →' : '次の問題 →';
  }

  function quizNext() {
    if (quizIndex < QUIZ.length - 1) {
      quizIndex++;
      quizRenderQuestion();
    } else {
      quizShowResult();
    }
  }

  function quizShowResult() {
    document.getElementById('quiz-progress-fill').style.width = '100%';
    document.getElementById('quiz-progress-text').textContent = '完了 ' + QUIZ.length + ' / ' + QUIZ.length;
    document.getElementById('quiz-cat-badge').textContent = '';
    document.getElementById('quiz-question-area').style.display = 'none';

    var correctCount = 0;
    var byCategory = {};
    QUIZ.forEach(function (item, i) {
      if (!byCategory[item.category]) byCategory[item.category] = { correct: 0, total: 0 };
      byCategory[item.category].total++;
      if (quizAnswers[i] === item.correct) { correctCount++; byCategory[item.category].correct++; }
    });
    var pct = Math.round((correctCount / QUIZ.length) * 100);

    var catHtml = '';
    Object.keys(byCategory).forEach(function (cat) {
      var c = byCategory[cat];
      var p = Math.round((c.correct / c.total) * 100);
      catHtml += '<div class="cat-result-row"><span class="text-xs" style="width:110px; flex-shrink:0;">' + cat + '</span>' +
        '<div class="cat-result-bar"><div class="cat-result-fill" style="width:' + p + '%"></div></div>' +
        '<span class="text-xs muted" style="width:56px; text-align:right;">' + c.correct + '/' + c.total + '</span></div>';
    });

    var reviewHtml = '';
    QUIZ.forEach(function (item, i) {
      if (quizAnswers[i] !== item.correct) {
        reviewHtml += '<div class="review-item">' +
          '<div class="text-sm font-semibold mb-1">' + item.q + '</div>' +
          '<div class="text-xs muted mb-2">あなたの回答: ' + (quizAnswers[i] != null ? item.choices[quizAnswers[i]] : '(未回答)') + ' / 正解: ' + item.choices[item.correct] + '</div>' +
          '<div class="text-xs" style="line-height:1.6;">' + item.explain + '</div>' +
          '</div>';
      }
    });
    if (!reviewHtml) reviewHtml = '<p class="text-sm secondary">全問正解です。見直しの必要な項目はありません 🎉</p>';

    var resultArea = document.getElementById('quiz-result-area');
    resultArea.style.display = 'block';
    resultArea.innerHTML =
      '<div class="text-center mb-6">' +
        '<div class="score-ring-num" style="color:var(--series-new);">' + correctCount + ' / ' + QUIZ.length + '</div>' +
        '<div class="text-sm muted mt-1">正答率 ' + pct + '%</div>' +
      '</div>' +
      '<div class="mb-6"><div class="text-sm font-semibold mb-3">カテゴリ別正答率</div>' + catHtml + '</div>' +
      '<div class="mb-2 text-sm font-semibold">見直し(不正解・未回答の問題)</div>' +
      '<div class="mb-6">' + reviewHtml + '</div>' +
      '<div class="flex flex-wrap gap-3 justify-center">' +
        '<button type="button" class="quiz-btn" onclick="quizRestart(true)">🔀 シャッフルしてもう一度</button>' +
        '<a href="lung.html" class="quiz-btn-outline" style="text-decoration:none; display:inline-block;">レポート本文に戻る</a>' +
      '</div>';
  }

  function quizRestart(shuffle) {
    quizOrder = QUIZ.map(function (_, i) { return i; });
    if (shuffle) quizShuffle(quizOrder);
    quizIndex = 0;
    quizAnswers = [];
    quizRenderQuestion();
  }

  quizRenderQuestion();
</script>
